<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اساتید | Course Management</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Course Management</a>
      <div class="navbar-nav">
        <a class="nav-link" href="courses.html">دوره‌ها</a>
        <a class="nav-link active" href="teachers.html">اساتید</a>
        <a class="nav-link" href="students.html">دانشجویان</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>لیست اساتید</h3>
      <button class="btn btn-primary" id="addTeacherBtn" data-bs-toggle="modal" data-bs-target="#teacherModal">
        افزودن استاد
      </button>
    </div>

    <div class="mb-3">
      <input type="text" class="form-control" id="searchInput" placeholder="جستجو بر اساس تخصص...">
    </div>

    <div id="errorBox" class="alert alert-danger d-none"></div>

    <table class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>#</th>
          <th>نام</th>
          <th>نام خانوادگی</th>
          <th>ایمیل</th>
          <th>تخصص</th>
          <th>عملیات</th>
        </tr>
      </thead>
      <tbody id="teachersTableBody">
        <tr>
          <td colspan="6" class="text-center text-muted">در حال بارگذاری...</td>
        </tr>
      </tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <button class="btn btn-outline-secondary" id="prevPageBtn">قبلی</button>
      <span id="pageInfo"></span>
      <button class="btn btn-outline-secondary" id="nextPageBtn">بعدی</button>
    </div>
  </div>

  <!-- Modal برای افزودن/ویرایش استاد: فیلدها دقیقاً مطابق TeacherRequest -->
  <div class="modal fade" id="teacherModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="teacherModalLabel">افزودن استاد</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">

          <div id="formErrorBox" class="alert alert-danger d-none"></div>

          <form id="teacherForm">
            <div class="mb-3">
              <label class="form-label">نام (۲ تا ۱۵ کاراکتر)</label>
              <input type="text" class="form-control" id="firstName" minlength="2" maxlength="15" required>
            </div>
            <div class="mb-3">
              <label class="form-label">نام خانوادگی (۲ تا ۱۵ کاراکتر)</label>
              <input type="text" class="form-control" id="lastName" minlength="2" maxlength="15" required>
            </div>
            <div class="mb-3">
              <label class="form-label">ایمیل</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">تخصص (۲ تا ۲۵ کاراکتر)</label>
              <input type="text" class="form-control" id="specialty" minlength="2" maxlength="25" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-primary" id="saveTeacherBtn">ذخیره</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal مشاهده دوره‌های این استاد (فقط نمایش) -->
  <div class="modal fade" id="relatedCoursesModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="relatedCoursesModalLabel">دوره‌ها</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <ul id="relatedCoursesList" class="list-group"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/teachers.js"></script>
  <script src="js/relations.js"></script>
</body>
</html>
