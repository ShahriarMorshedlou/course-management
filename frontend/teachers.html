```
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>لیست اساتید</h3>

  <button
    class="btn btn-primary"
    id="addTeacherBtn"
    data-bs-toggle="modal"
    data-bs-target="#teacherModal">
    افزودن استاد
  </button>
</div>


<div class="mb-3">
  <input
    type="text"
    class="form-control"
    id="searchInput"
    placeholder="جستجو بر اساس تخصص...">
</div>


<!-- محل نمایش خطاهای مربوط به لیست -->
<div id="errorBox" class="alert alert-danger d-none"></div>


<table class="table table-striped table-bordered">

  <thead>
    <tr>
      <th>#</th>
      <th>نام</th>
      <th>نام خانوادگی</th>
      <th>ایمیل</th>
      <th>تخصص</th>
      <th>عملیات</th>
    </tr>
  </thead>

  <tbody id="teachersTableBody">
    <tr>
      <td colspan="6" class="text-center text-muted">
        در حال بارگذاری...
      </td>
    </tr>
  </tbody>

</table>
```

  </div>

  <!-- Modal برای افزودن / ویرایش استاد -->

  <div class="modal fade" id="teacherModal" tabindex="-1">

```
<div class="modal-dialog">

  <div class="modal-content">

    <div class="modal-header">
      <h5 class="modal-title" id="teacherModalLabel">
        افزودن استاد
      </h5>

      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal">
      </button>
    </div>


    <div class="modal-body">

      <!-- خطای مربوط به فرم -->
      <div
        id="formErrorBox"
        class="alert alert-danger d-none">
      </div>


      <form id="teacherForm">

        <div class="mb-3">
          <label class="form-label">
            نام
          </label>

          <input
            type="text"
            class="form-control"
            id="firstName"
            maxlength="15"
            required>
        </div>


        <div class="mb-3">
          <label class="form-label">
            نام خانوادگی
          </label>

          <input
            type="text"
            class="form-control"
            id="lastName"
            maxlength="15"
            required>
        </div>


        <div class="mb-3">
          <label class="form-label">
            ایمیل
          </label>

          <input
            type="email"
            class="form-control"
            id="email"
            required>
        </div>


        <div class="mb-3">
          <label class="form-label">
            تخصص
          </label>

          <input
            type="text"
            class="form-control"
            id="specialty"
            maxlength="25"
            required>
        </div>

      </form>

    </div>


    <div class="modal-footer">

      <button
        type="button"
        class="btn btn-secondary"
        data-bs-dismiss="modal">
        انصراف
      </button>

      <button
        type="button"
        class="btn btn-primary"
        id="saveTeacherBtn">
        ذخیره
      </button>

    </div>

  </div>

</div>
```

  </div>
